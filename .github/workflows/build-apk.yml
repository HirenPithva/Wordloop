name: Build debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o WordLoop-phase1-1.zip

      - name: Patch for AGP 9 / Hilt / SDK 37 compatibility
        run: |
          cd WordLoop
          sed -i '/alias(libs\.plugins\.kotlin\.android)/d' build.gradle.kts app/build.gradle.kts
          sed -i '/kotlinOptions {/,/^    }/d' app/build.gradle.kts
          cat >> app/build.gradle.kts << 'PATCH'

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }
          PATCH
          sed -i 's/hilt = "2.57.1"/hilt = "2.59.2"/' gradle/libs.versions.toml
          sed -i 's/compileSdk = 36/compileSdk = 37/' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 37/' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Install required SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        working-directory: WordLoop
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordloop-debug-apk
          path: WordLoop/app/build/outputs/apk/debug/app-debug.apk
